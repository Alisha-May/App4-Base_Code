<head> 
    <title>PMS or Early Signs of Pregnancy?</title> 
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="w3.css">
    <link rel="stylesheet" href="w3-colors-flat.css">
    <style>
        /* CSS for positioning the image */
        #image-container {
            text-align: center; /* Align the image to the center of the container */
            padding-top: 20px; /* Optional: adds space above the image */
        }
        #image-container img {
            max-width: 100%; /* Makes sure the image doesn't overflow */
            width: 300px; /* Adjust the size of the image */
            display: inline-block; /* Aligns the image to the right */
        }
        /* Hide all pages initially */
        .page {
            display: none;
        }
        /* Show the active page */
        .page.active {
            display: block;
        }
    </style>
</head> 

<body>
    <div id="header" class="w3-container w3-flat-pomegranate">
        <h1>PMS or Pregnancy?</h1>
    </div>

    <div id="image-container">
        <img src="https://github.com/Alisha-May/App4-Base_Code/blob/gh-pages/PMSPreg.jpg?raw=true" alt="image of PMS/Pregnancy">
    </div>

    <div id="content" class="w3-container">
        <p>Are you feeling like you might be pregnant but wonder if it is just PMS? Answer a few short questions to find out!</p>
        <a href="#one" class="w3-btn w3-grey w3-round"> Get Started </a>
        <p><strong>Disclaimer:</strong> This is for entertainment purposes only and should not be used for medical diagnosis.</p>
    </div>

    <script>
        function PMSAdd() {
            let PMS_count = localStorage.getItem("PMS_count") || 0;
            PMS_count = parseInt(PMS_count) + 1;
            localStorage.setItem("PMS_count", PMS_count);
            console.log("PMS Count: " + PMS_count);
        }

        function pregnancyAdd() {
            let pregnancy_count = localStorage.getItem("pregnancy_count") || 0;
            pregnancy_count = parseInt(pregnancy_count) + 1;
            localStorage.setItem("pregnancy_count", pregnancy_count);
            console.log("Pregnancy Count: " + pregnancy_count);
        }

        function resultsPercent() {
            var PMS_count = parseInt(localStorage.getItem("PMS_count")) || 0;
            var pregnancy_count = parseInt(localStorage.getItem("pregnancy_count")) || 0;
            
            var PMSPercent = (PMS_count / 4) * 100;
            var pregnancyPercent = (pregnancy_count / 4) * 100;
            
            document.getElementById("resultsText").innerHTML = 
                `<h2>Diagnosis Results:</h2>
                <p>Probability of Having PMS: <strong>${PMSPercent.toFixed(1)}%</strong></p>
                <p>Probability of Being Pregnant: <strong>${pregnancyPercent.toFixed(1)}%</strong></p>`;
            
            localStorage.removeItem("PMS_count");
            localStorage.removeItem("pregnancy_count");
        }

        document.addEventListener("DOMContentLoaded", function () {
            let pages = document.querySelectorAll(".page");
            let links = document.querySelectorAll("a[href^='#']");

            function showPage(hash) {
                pages.forEach(page => page.classList.remove("active"));
                let activePage = document.querySelector(hash);
                if (activePage) {
                    activePage.classList.add("active");
                }
            }

            links.forEach(link => {
                link.addEventListener("click", function (event) {
                    let targetId = this.getAttribute("href");
                    if (targetId.startsWith("#")) {
                        event.preventDefault(); 
                        showPage(targetId);
                    }
                });
            });

            showPage("#one");
        });
    </script>
</body>
</html>
